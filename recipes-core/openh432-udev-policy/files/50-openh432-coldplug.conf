[Service]
# Replay device events, not bus/driver/module bookkeeping events.
# Keep every device subsystem, parent ordering and normal hotplug processing.
ExecStart=
# Queue the built-in maintenance tty before bulk device enumeration.
# The normal pass is retained, including this tty if it appeared late.
ExecStart=-udevadm trigger --action=add /sys/class/tty/ttyGS0
ExecStart=-udevadm trigger --type=devices --action=add --prioritized-subsystem=block,tpmrm,net,tty,input
