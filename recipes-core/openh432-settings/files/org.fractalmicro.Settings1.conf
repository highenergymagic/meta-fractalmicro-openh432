<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.fractalmicro.Settings1"/>
  </policy>
  <policy context="default">
    <!-- Method-level authorization uses the bus-authenticated caller UID. -->
    <allow send_destination="org.fractalmicro.Settings1"/>
  </policy>
</busconfig>
