# SPDX-License-Identifier: MIT
DISTRO = "openh432"
DISTRO_NAME = "OpenH432 by Fractal Microsystems"
DISTRO_VERSION = "0.1-dev"
DISTRO_CODENAME = "bringup"
TCLIBC = "glibc"
INIT_MANAGER = "systemd"
DISTRO_FEATURES_DEFAULTS = "acl alsa ipv4 ipv6 xattr seccomp ldconfig"
DISTRO_FEATURES = "systemd usrmerge polkit acl xattr selinux"
PREFERRED_PROVIDER_virtual/refpolicy = "refpolicy-targeted"
# Qualification builds collect denials; this is not a production security mode.
OPENH432_SELINUX_MODE ?= "permissive"
DEFAULT_ENFORCING:pn-refpolicy-targeted = "${OPENH432_SELINUX_MODE}"
FIRST_BOOT_RELABEL = "0"
PACKAGE_CLASSES = "package_ipk"
IMAGE_LINGUAS = ""
GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
# Recipe versions, compiler and libc are fixed by the OE-Core commit.
# No host-distribution target compiler or libraries enter the image.
# udev must resolve device modaliases for packaged hardware modules.
PACKAGECONFIG:pn-systemd = "acl seccomp hostnamed logind networkd resolved timesyncd sysusers serial-getty-generator repart sysext zstd openssl kmod"
VIRTUAL-RUNTIME_login_manager = "busybox"
VIRTUAL-RUNTIME_initscripts = ""
