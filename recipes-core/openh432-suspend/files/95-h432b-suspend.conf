# Include only with the board's qualified deep-sleep and cell-power path.
# Distinct actions enable logind's duration recognition: suspend on release,
# or graceful shutdown after its five-second long-press threshold.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
