[Service]
# The root filesystem is already mounted by the handoff initramfs. Replay only
# local accessibility devices before sysinit; the complete pass runs afterward.
ExecStart=
ExecStart=-udevadm trigger --action=add /sys/class/tty/ttyGS0
ExecStart=udevadm trigger --type=devices --action=add --subsystem-match=input --subsystem-match=sound --subsystem-match=misc
