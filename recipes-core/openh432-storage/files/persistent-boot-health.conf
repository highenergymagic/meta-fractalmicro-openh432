[Service]
# Atomic publication of last-good needs its parent directory writable.
# Other persistent state remains read-only in this service's mount namespace.
ReadWritePaths=-/.openh432/userdata
ReadOnlyPaths=-/.openh432/userdata/var -/.openh432/userdata/home -/.openh432/userdata/root -/.openh432/userdata/data -/.openh432/userdata/identity -/.openh432/userdata/deployments
